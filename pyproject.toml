[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "f1predict"
version = "0.1.0"
description = "Leakage-safe Formula 1 race outcome prediction"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "MIT"}
dependencies = [
  "fastf1>=3.5,<4",
  "httpx>=0.27,<1",
  "joblib>=1.4,<2",
  "lightgbm>=4.5,<5",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "platformdirs>=4.3,<5",
  "pyarrow>=17,<23",
  "rich>=13.9,<15",
  "scikit-learn>=1.6,<2",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
ml = [
  "matplotlib>=3.9,<4",
  "shap>=0.46,<1",
]
dev = [
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.8,<1",
]

[project.scripts]
f1predict = "f1predict.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
